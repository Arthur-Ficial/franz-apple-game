<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2e7d32" />
    <title>Apple Game</title>
    <style>
      :root {
        --hud-bg: rgba(0, 0, 0, 0.45);
        --hud-fg: #ffffff;
        --accent: #ffd54f;
        --danger: #e53935;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2e7d32;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: var(--hud-fg);
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
        cursor: crosshair;
      }
      .hud {
        position: fixed;
        top: env(safe-area-inset-top, 0);
        left: 0;
        right: 0;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: start;
        padding: 14px 18px;
        pointer-events: none;
        z-index: 10;
        font-weight: 700;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
      }
      .hud > * { pointer-events: auto; }
      #hud-score-box { font-size: 24px; line-height: 1; }
      #hud-score-box .label { font-size: 11px; font-weight: 500; opacity: 0.85; letter-spacing: 0.1em; text-transform: uppercase; display: block; margin-bottom: 4px; }
      #hud-score { font-size: 32px; font-variant-numeric: tabular-nums; }
      #hud-center { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      #hud-combo {
        font-size: 28px;
        font-weight: 800;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        transition: transform 120ms ease-out;
      }
      #hud-combo.bump { transform: scale(1.4); }
      #hud-mute {
        background: var(--hud-bg);
        border: 0;
        border-radius: 999px;
        width: 44px;
        height: 44px;
        font-size: 22px;
        color: var(--hud-fg);
        cursor: pointer;
      }
      #hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
      #hud-hearts { font-size: 26px; line-height: 1; letter-spacing: 2px; }
      #hud-fullscreen {
        background: var(--hud-bg);
        border: 0;
        border-radius: 999px;
        width: 40px;
        height: 40px;
        font-size: 18px;
        color: var(--hud-fg);
        cursor: pointer;
      }
      #game-over {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.72);
        z-index: 20;
        padding: 24px;
      }
      #game-over.hidden { display: none; }
      #game-over .panel {
        background: #ffffff;
        color: #1a1a1a;
        border-radius: 18px;
        padding: 28px 26px;
        max-width: 360px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      #game-over h1 { margin: 0 0 6px; font-size: 28px; }
      #game-over .final {
        font-size: 56px;
        font-weight: 800;
        color: var(--danger);
        margin: 8px 0 16px;
        font-variant-numeric: tabular-nums;
      }
      #game-over h2 { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #666; margin: 14px 0 8px; }
      #top-scores { list-style: none; padding: 0; margin: 0 0 18px; font-size: 16px; }
      #top-scores li { padding: 6px 0; border-bottom: 1px solid #eee; }
      #top-scores li:last-child { border-bottom: 0; }
      #top-scores li strong { color: var(--danger); font-variant-numeric: tabular-nums; }
      #restart-btn {
        background: var(--danger);
        color: #ffffff;
        border: 0;
        border-radius: 999px;
        padding: 14px 28px;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        margin-top: 4px;
      }
      #restart-btn:active { transform: scale(0.98); }
      #clear-scores {
        margin-top: 10px;
        background: transparent;
        border: 0;
        font-size: 12px;
        color: #999;
        cursor: pointer;
        text-decoration: underline;
      }
      @media (max-width: 480px) {
        .hud { padding: 10px 12px; }
        #hud-score { font-size: 26px; }
        #hud-score-box .label { font-size: 10px; }
        #hud-combo { font-size: 22px; }
        #hud-hearts { font-size: 22px; }
        #hud-mute { width: 38px; height: 38px; font-size: 18px; }
        #hud-fullscreen { width: 34px; height: 34px; font-size: 16px; }
      }
      @media (max-height: 380px) {
        #hud-score-box .label { display: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div class="hud">
      <div id="hud-score-box">
        <span class="label">Score</span>
        <span id="hud-score">0</span>
      </div>
      <div id="hud-center">
        <div id="hud-combo">×1</div>
        <button id="hud-mute" type="button" aria-label="Toggle sound">🔊</button>
      </div>
      <div id="hud-right">
        <div id="hud-hearts" aria-label="Lives">❤❤❤</div>
        <button id="hud-fullscreen" type="button" aria-label="Toggle fullscreen">⛶</button>
      </div>
    </div>

    <div id="game-over" class="hidden" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
      <div class="panel">
        <h1 id="game-over-title">Game Over</h1>
        <div class="final"><span id="final-score">0</span></div>
        <h2>Top scores</h2>
        <ol id="top-scores"></ol>
        <button id="restart-btn" type="button">Play again</button>
        <button id="clear-scores" type="button">Clear leaderboard</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
